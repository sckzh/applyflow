<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历编辑 - JobHub 校园求职</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100">
  <div class="page-wrap">
    <nav id="global-nav" class="app-nav"></nav>

    <main class="page-main" style="max-width: 860px;">
      <div class="flex items-center justify-between flex-wrap gap-8 mb-20">
        <h1 style="font-size: 22px; font-weight: 800;">
          <i class="fa fa-file-text" style="color: #2563eb;"></i> 简历编辑
        </h1>
        <a class="btn btn-outline btn-sm" href="resume-preview.html"><i class="fa fa-eye"></i><span>查看 A4 预览</span></a>
      </div>

      <!-- ==================== AI 操作区 ==================== -->
      <section class="card" id="ai-section" style="border-color: #fcd34d; background: #fffbeb;">
        <h2 class="card-title" style="color: #92400e;"><i class="fa fa-magic" style="color: #d97706;"></i>AI 助手</h2>

        <!-- 岗位信息条（带 jobId 进入时展示） -->
        <div id="ai-job-banner" class="hidden mb-16">
          <div class="flex items-center flex-wrap gap-12" style="background: #fef3c7; border-radius: 10px; padding: 12px 16px;">
            <i class="fa fa-briefcase" style="color: #b45309;"></i>
            <span style="font-weight: 700;">目标岗位：<span id="ai-job-title"></span></span>
            <span class="text-sub" style="font-size: 13px;" id="ai-job-meta"></span>
            <a id="ai-job-link" class="btn btn-gray btn-sm" href="#">查看岗位</a>
          </div>
        </div>

        <p class="text-sub mb-16" style="font-size: 13px;" id="ai-tip">
          点击下方按钮，AI 将基于当前表单内容生成 / 优化建议。生成结果<strong>不会自动覆盖</strong>你的简历，需要点击"填入"确认后才会写入表单。
        </p>

        <div class="flex flex-wrap gap-8">
          <button id="btn-ai-generate" class="btn btn-primary">
            <i class="fa fa-magic"></i><span>AI 生成简历建议</span>
          </button>
          <button id="btn-ai-again" class="btn btn-outline hidden">
            <i class="fa fa-refresh"></i><span>重新生成</span>
          </button>
        </div>

        <!-- AI 错误提示 + 重试 -->
        <div id="ai-error" class="hidden mt-16" style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 8px; padding: 12px 16px; font-size: 13px;">
          <i class="fa fa-exclamation-circle"></i> <span id="ai-error-text"></span>
          <button id="btn-ai-retry" class="btn btn-gray btn-sm ml-8">重试</button>
        </div>

        <!-- AI 结果展示区 -->
        <div id="ai-result" class="ai-result hidden">
          <div class="ai-result-badge"><i class="fa fa-flask"></i>【模拟结果】此内容由前端模拟生成，接入真实 AI 接口后替换</div>
          <div class="ai-result-content" id="ai-result-content"></div>
          <div class="flex flex-wrap gap-8 mt-16">
            <button id="btn-ai-copy" class="btn btn-outline btn-sm"><i class="fa fa-copy"></i><span>复制</span></button>
            <button id="btn-ai-fill" class="btn btn-primary btn-sm"><i class="fa fa-arrow-down"></i><span>填入简历</span></button>
            <button id="btn-ai-discard" class="btn btn-gray btn-sm"><i class="fa fa-times"></i><span>放弃</span></button>
          </div>
        </div>
      </section>

      <!-- ==================== 简历表单 ==================== -->
      <div id="resume-state" class="card"></div>

      <form id="resume-form" class="hidden" novalidate>
        <!-- 基本信息 -->
        <section class="card">
          <h2 class="card-title"><i class="fa fa-id-card"></i>基本信息</h2>
          <div class="dynamic-grid">
            <div>
              <label class="form-label" for="ba-name">姓名<span class="req">*</span></label>
              <input class="form-input" type="text" id="ba-name" placeholder="真实姓名">
            </div>
            <div>
              <label class="form-label" for="ba-gender">性别</label>
              <select class="form-select" id="ba-gender">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="ba-birth">出生日期</label>
              <input class="form-input" type="date" id="ba-birth">
            </div>
            <div>
              <label class="form-label" for="ba-phone">电话</label>
              <input class="form-input" type="tel" id="ba-phone" placeholder="手机号">
            </div>
            <div>
              <label class="form-label" for="ba-email">邮箱</label>
              <input class="form-input" type="email" id="ba-email" placeholder="example@stu.edu.cn">
            </div>
            <div>
              <label class="form-label" for="ba-city">所在城市</label>
              <input class="form-input" type="text" id="ba-city" placeholder="如：上海">
            </div>
            <div class="span-2">
              <label class="form-label" for="ba-target">求职意向</label>
              <input class="form-input" type="text" id="ba-target" placeholder="如：Java 开发工程师">
            </div>
            <div class="span-2">
              <label class="form-label" for="ba-selfintro">自我评价（支持多行，长文本请放心填写）</label>
              <textarea class="form-textarea" id="ba-selfintro" rows="6"
                placeholder="介绍你的专业背景、核心能力与职业规划，支持换行"></textarea>
            </div>
          </div>
        </section>

        <!-- 教育经历 -->
        <section class="card">
          <div class="flex items-center justify-between flex-wrap gap-8 mb-16">
            <h2 class="card-title" style="margin-bottom: 0;"><i class="fa fa-graduation-cap"></i>教育经历</h2>
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-edu"><i class="fa fa-plus"></i><span>添加一条</span></button>
          </div>
          <div id="edu-list"></div>
          <p class="form-hint" id="edu-empty-hint">暂无教育经历，点击"添加一条"开始填写。</p>
        </section>

        <!-- 项目经历 -->
        <section class="card">
          <div class="flex items-center justify-between flex-wrap gap-8 mb-16">
            <h2 class="card-title" style="margin-bottom: 0;"><i class="fa fa-cubes"></i>项目经历</h2>
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-proj"><i class="fa fa-plus"></i><span>添加一条</span></button>
          </div>
          <div id="proj-list"></div>
          <p class="form-hint" id="proj-empty-hint">暂无项目经历，点击"添加一条"开始填写。</p>
        </section>

        <!-- 技能特长 -->
        <section class="card">
          <h2 class="card-title"><i class="fa fa-wrench"></i>技能特长</h2>
          <textarea class="form-textarea" id="skills-input" rows="5"
            placeholder="每行一个技能，例如：&#10;Java&#10;Spring Boot&#10;MySQL"></textarea>
          <p class="form-hint">每行一个技能，保存后可在预览页看到标签效果。</p>
        </section>

        <button type="submit" class="btn btn-primary btn-block mt-16" id="btn-save-resume" style="padding: 13px;">
          <i class="fa fa-save"></i><span>保存简历</span>
        </button>
      </form>
    </main>

    <footer id="global-footer" class="app-footer"></footer>
  </div>

  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/resume-editor.js"></script>
</body>
</html>
