<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位详情 - JobHub 校园求职</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100">
  <div class="page-wrap">
    <nav id="global-nav" class="app-nav"></nav>

    <main class="page-main" style="max-width: 860px;">
      <a href="index.html" class="btn btn-gray btn-sm mb-16"><i class="fa fa-arrow-left"></i><span>返回岗位列表</span></a>

      <!-- 三态区块 -->
      <div id="detail-state"></div>

      <!-- 详情内容 -->
      <div id="detail-body" class="hidden">
        <section class="card">
          <div class="detail-head">
            <div class="flex gap-12 flex-1" style="min-width: 240px;">
              <div class="detail-company" id="detail-company-logo">J</div>
              <div>
                <h1 id="detail-title" style="font-size: 22px; font-weight: 800;"></h1>
                <div class="detail-meta">
                  <span id="detail-company"><i class="fa fa-building-o"></i> </span>
                  <span id="detail-city"><i class="fa fa-map-marker"></i> </span>
                  <span id="detail-published"><i class="fa fa-clock-o"></i> </span>
                  <span id="detail-status"></span>
                </div>
                <div class="detail-meta"><span class="salary" id="detail-salary"></span></div>
                <div id="detail-tags" class="flex flex-wrap mt-8"></div>
              </div>
            </div>
            <!-- 操作按钮 -->
            <div class="flex flex-col gap-8" style="min-width: 200px;">
              <button id="btn-favorite" class="btn btn-outline btn-block"><i class="fa fa-star-o"></i><span>收藏岗位</span></button>
              <button id="btn-apply" class="btn btn-primary btn-block"><i class="fa fa-paper-plane"></i><span>立即投递</span></button>
              <button id="btn-optimize" class="btn btn-gray btn-block"><i class="fa fa-magic"></i><span>用这个岗位优化简历</span></button>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="detail-section-title"><i class="fa fa-file-text-o"></i>岗位详情</h2>
          <p class="jd-text" id="detail-description"></p>
        </section>

        <section class="card">
          <h2 class="detail-section-title"><i class="fa fa-check-square-o"></i>任职要求</h2>
          <div id="detail-requirements"></div>
        </section>
      </div>
    </main>

    <footer id="global-footer" class="app-footer"></footer>
  </div>

  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/job-detail.js"></script>
</body>
</html>
